<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ray-traced office</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #111; color: #ddd; font: 13px/1.4 system-ui, sans-serif; }
      #view { display: block; width: 100%; height: 100%; outline: none; }
      #hud { position: fixed; top: 8px; left: 8px; padding: 4px 8px; background: #0009; border-radius: 4px; pointer-events: none; }
      #timings { position: fixed; top: 40px; left: 8px; margin: 0; padding: 4px 8px; background: #0009; border-radius: 4px; font: 12px/1.3 ui-monospace, monospace; pointer-events: none; }
      #hud.error { inset: 0; display: grid; place-items: center; padding: 16px; font-size: 16px; text-align: center; border-radius: 0; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud" role="status"></div>
    <pre id="timings" hidden></pre>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
